<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تخصيص كارت ZEKRA</title>
  <!-- مكتبة Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { 
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; 
      padding: 20px; 
      background: #f8f9fa; 
      color: #333; 
    }
    .card-form { 
      max-width: 450px; 
      margin: 30px auto; 
      background: #ffffff; 
      padding: 25px; 
      border-radius: 16px; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.08); 
    }
    h2 { margin-top: 0; color: #111; text-align: center; }
    .form-group { margin-bottom: 15px; text-align: right; }
    label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; }
    input[type="text"], textarea, input[type="file"] { 
      width: 100%; 
      padding: 12px; 
      border-radius: 8px; 
      border: 1px solid #ddd; 
      box-sizing: border-box; 
      font-size: 14px; 
    }
    button { 
      width: 100%; 
      background: #000; 
      color: #fff; 
      padding: 14px; 
      border: none; 
      border-radius: 8px; 
      font-weight: bold; 
      font-size: 16px; 
      cursor: pointer; 
      transition: background 0.2s; 
      margin-top: 10px; 
    }
    button:hover { background: #222; }
    button:disabled { background: #888; cursor: not-allowed; }
  </style>
</head>
<body>

<div class="card-form">
  <h2>تخصيص كارت ذكراكم ✨</h2>
  <form id="memoryForm">
    <div class="form-group">
      <label>كود الكارت الفريد</label>
      <input type="text" id="cardId" placeholder="مثال: zekra100" required>
    </div>

    <div class="form-group">
      <label>الأسماء</label>
      <input type="text" id="names" placeholder="مثال: عمر وسارة" required>
    </div>

    <div class="form-group">
      <label>الرسالة الخاصة</label>
      <textarea id="note" rows="3" placeholder="اكتب رسالتكم المميزة هنا..."></textarea>
    </div>

    <div class="form-group">
      <label>الصورة الرئيسية</label>
      <input type="file" id="photo1" accept="image/*" required>
    </div>

    <button type="submit" id="saveBtn">حفظ وتفعيل الكارت 🚀</button>
  </form>
</div>

<script>
  // بيانات Supabase الخاصة بك
  const SUPABASE_URL = 'https://rzyncxxjblnzngndjzie.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_iPEdZoG1LE2AVzfi0FkjaA_PHxhn5Qt';
  
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  document.getElementById('memoryForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('saveBtn');
    btn.innerText = 'جاري الحفظ والرفع... ⏳';
    btn.disabled = true;

    const cardId = document.getElementById('cardId').value.trim();
    const names = document.getElementById('names').value.trim();
    const note = document.getElementById('note').value.trim();
    const file1 = document.getElementById('photo1').files[0];

    try {
      // 1. رفع الصورة إلى Supabase Storage
      const fileName = `${cardId}-photo1.jpg`;
      const { error: uploadError } = await supabaseClient.storage
        .from('photos')
        .upload(fileName, file1, { upsert: true });

      if (uploadError) throw uploadError;

      // رابط الصورة المرفوعة
      const photo1Url = `${SUPABASE_URL}/storage/v1/object/public/photos/${fileName}`;

      // 2. حفظ البيانات في جدول cards
      const { error: dbError } = await supabaseClient
        .from('cards')
        .upsert([{ 
          card_id: cardId, 
          names: names, 
          note: note,
          photo1: photo1Url 
        }], { onConflict: 'card_id' });

      if (dbError) throw dbError;

      alert('تم حفظ البيانات بنجاح! 🎉');
      // تحويل المستخدم لرؤية الكارت الخاص به
      window.location.href = `/?card=${cardId}`;

    } catch (err) {
      alert('حدث خطأ أثناء الحفظ: ' + err.message);
      btn.innerText = 'حفظ وتفعيل الكارت 🚀';
      btn.disabled = false;
    }
  });
</script>

</body>
</html>
